<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>APIPOKEMON - Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body { padding: 20px; }
      .hidden { display: none; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="mb-4">APIPOKEMON - Panel</h1>

      <div id="alert-area"></div>

      <!-- Login -->
      <div id="login-card" class="card mb-4">
        <div class="card-body">
          <h5 class="card-title">Iniciar sesión</h5>
          <form id="login-form" onsubmit="event.preventDefault(); login();">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="password" required>
            </div>
            <button class="btn btn-primary" type="submit">Entrar</button>
            <button class="btn btn-secondary ms-2" type="button" onclick="fillExample('profesor')">Ejemplo Profesor</button>
            <button class="btn btn-secondary ms-2" type="button" onclick="fillExample('trainer')">Ejemplo Trainer</button>
          </form>
        </div>
      </div>

      <!-- User info & actions -->
      <div id="user-card" class="card mb-4 hidden">
        <div class="card-body">
          <h5 class="card-title">Usuario</h5>
          <p id="user-info"></p>
          <button class="btn btn-danger" onclick="logout()">Cerrar sesión</button>
        </div>
      </div>

      <!-- Profesor panel -->
      <div id="profesor-panel" class="hidden">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3>Panel Profesor</h3>
          <div>
            <button class="btn btn-success" onclick="showCreateForm()">Crear Pokémon</button>
          </div>
        </div>

        <div id="create-form" class="card mb-3 hidden">
          <div class="card-body">
            <h5 class="card-title">Crear / Editar Pokémon</h5>
            <form id="pokemon-form" onsubmit="event.preventDefault(); submitPokemonForm();">
              <input type="hidden" id="pokemon-id">
              <div class="row">
                <div class="col-md-6 mb-2">
                  <input class="form-control" id="p-nombre" placeholder="Nombre" required>
                </div>
                <div class="col-md-6 mb-2">
                  <input class="form-control" id="p-tipo" placeholder="Tipo" required>
                </div>
              </div>
              <div class="row">
                <div class="col-md-3 mb-2"><input type="number" min="1" class="form-control" id="p-nivel" placeholder="Nivel" required></div>
                <div class="col-md-3 mb-2"><input type="number" step="0.1" class="form-control" id="p-ataque" placeholder="Poder ataque" required></div>
                <div class="col-md-3 mb-2"><input type="number" step="0.1" class="form-control" id="p-defensa" placeholder="Poder defensa" required></div>
                <div class="col-md-3 mb-2"><input type="number" class="form-control" id="p-hp" placeholder="HP" required></div>
              </div>
              <div class="mb-2"><textarea id="p-desc" class="form-control" placeholder="Descripción"></textarea></div>
              <button class="btn btn-primary" type="submit">Guardar</button>
              <button class="btn btn-secondary ms-2" type="button" onclick="hideCreateForm()">Cancelar</button>
            </form>
          </div>
        </div>

        <div id="profesor-list" class="list-group"></div>
      </div>

      <!-- Trainer panel -->
      <div id="trainer-panel" class="hidden">
        <h3>Panel Trainer</h3>
        <div id="trainer-list" class="list-group"></div>
      </div>

      <hr>
      <p class="text-muted">Nota: Esta interfaz usa la API en /auth y /api. Asegúrate de que la aplicación Flask esté corriendo.</p>
    </div>

    <script>
      const API_BASE = '';

      function showAlert(message, type='success'){
        const area = document.getElementById('alert-area');
        area.innerHTML = `<div class="alert alert-${type} alert-dismissible" role="alert">${message}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
      }

      function fillExample(role){
        if(role==='profesor'){
          document.getElementById('email').value = 'profesor@universidad.edu';
          document.getElementById('password').value = 'profesor123';
        } else {
          document.getElementById('email').value = 'ash@pokemon.com';
          document.getElementById('password').value = 'ash123';
        }
      }

      async function login(){
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try{
          const res = await fetch(API_BASE + '/auth/login', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({email, password})
          });

          const data = await res.json();
          if(!res.ok){ showAlert(data.error || data.message || 'Error al login', 'danger'); return; }

          localStorage.setItem('access_token', data.access_token);
          localStorage.setItem('refresh_token', data.refresh_token || '');
          localStorage.setItem('usuario', JSON.stringify(data.usuario));

          showAlert('Login exitoso', 'success');
          postLoginSetup();
        }catch(err){ showAlert(err.message, 'danger'); }
      }

      function logout(){
        localStorage.removeItem('access_token');
        localStorage.removeItem('refresh_token');
        localStorage.removeItem('usuario');
        document.getElementById('user-card').classList.add('hidden');
        document.getElementById('profesor-panel').classList.add('hidden');
        document.getElementById('trainer-panel').classList.add('hidden');
        document.getElementById('login-card').classList.remove('hidden');
        showAlert('Sesión cerrada', 'info');
      }

      function getAuthHeaders(){
        const token = localStorage.getItem('access_token');
        return token ? { 'Authorization': 'Bearer ' + token, 'Content-Type':'application/json' } : {'Content-Type':'application/json'};
      }

      async function postLoginSetup(){
        document.getElementById('login-card').classList.add('hidden');
        document.getElementById('user-card').classList.remove('hidden');
        const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
        document.getElementById('user-info').innerText = `${usuario.nombre} (${usuario.email}) - rol: ${usuario.rol}`;

        if(usuario.rol === 'profesor'){
          document.getElementById('profesor-panel').classList.remove('hidden');
          document.getElementById('trainer-panel').classList.add('hidden');
          loadAllPokemons();
        } else {
          document.getElementById('trainer-panel').classList.remove('hidden');
          document.getElementById('profesor-panel').classList.add('hidden');
          loadTrainerPokemons();
        }
      }

      // ---------- Profesor actions ----------
      async function loadAllPokemons(){
        try{
          const res = await fetch(API_BASE + '/api/pokemon', { headers: getAuthHeaders() });
          const data = await res.json();
          if(!res.ok){ showAlert(data.error || 'Error cargando pokemons', 'danger'); return; }

          const list = document.getElementById('profesor-list');
          list.innerHTML = '';

          data.pokemons.forEach(p => {
            const el = document.createElement('div');
            el.className = 'list-group-item d-flex justify-content-between align-items-start';
            el.innerHTML = `
              <div>
                <div><strong>${p.nombre}</strong> <small class="text-muted">(#${p.id})</small></div>
                <div>Tipo: ${p.tipo} | Nivel: ${p.nivel} | HP: ${p.hp}</div>
                <div class="small">${p.descripcion || ''}</div>
              </div>
              <div>
                <button class="btn btn-sm btn-info me-1" onclick='viewPokemon(${p.id})'>Ver</button>
                <button class="btn btn-sm btn-warning me-1" onclick='editPokemon(${p.id})'>Editar</button>
                <button class="btn btn-sm btn-danger me-1" onclick='deletePokemon(${p.id})'>Eliminar</button>
                <button class="btn btn-sm btn-primary" onclick='promptAsignar(${p.id})'>Asignar</button>
              </div>
            `;
            list.appendChild(el);
          });

        }catch(err){ showAlert(err.message, 'danger'); }
      }

      function showCreateForm(){
        document.getElementById('create-form').classList.remove('hidden');
        document.getElementById('pokemon-id').value = '';
        document.getElementById('p-nombre').value = '';
        document.getElementById('p-tipo').value = '';
        document.getElementById('p-nivel').value = 1;
        document.getElementById('p-ataque').value = 1;
        document.getElementById('p-defensa').value = 1;
        document.getElementById('p-hp').value = 10;
        document.getElementById('p-desc').value = '';
      }

      function hideCreateForm(){ document.getElementById('create-form').classList.add('hidden'); }

      async function submitPokemonForm(){
        const id = document.getElementById('pokemon-id').value;
        const payload = {
          nombre: document.getElementById('p-nombre').value,
          tipo: document.getElementById('p-tipo').value,
          nivel: parseInt(document.getElementById('p-nivel').value,10),
          poder_ataque: parseFloat(document.getElementById('p-ataque').value),
          poder_defensa: parseFloat(document.getElementById('p-defensa').value),
          hp: parseInt(document.getElementById('p-hp').value,10),
          descripcion: document.getElementById('p-desc').value
        };

        try{
          let res;
          if(id){
            res = await fetch(API_BASE + '/api/pokemon/' + id, { method: 'PUT', headers: getAuthHeaders(), body: JSON.stringify(payload) });
          } else {
            res = await fetch(API_BASE + '/api/pokemon', { method: 'POST', headers: getAuthHeaders(), body: JSON.stringify(payload) });
          }
          const data = await res.json();
          if(!res.ok){ showAlert(data.error || data.message || 'Error', 'danger'); return; }
          showAlert(data.message || 'OK', 'success');
          hideCreateForm();
          loadAllPokemons();
        }catch(err){ showAlert(err.message,'danger'); }
      }

      async function viewPokemon(id){
        try{
          const res = await fetch(API_BASE + '/api/pokemon/' + id, { headers: getAuthHeaders() });
          const data = await res.json();
          if(!res.ok){ showAlert(data.error || 'Error', 'danger'); return; }
          alert(JSON.stringify(data.pokemon || data, null, 2));
        }catch(err){ showAlert(err.message,'danger'); }
      }

      async function editPokemon(id){
        try{
          const res = await fetch(API_BASE + '/api/pokemon/' + id, { headers: getAuthHeaders() });
          const data = await res.json();
          if(!res.ok){ showAlert(data.error || 'Error', 'danger'); return; }
          const p = data.pokemon;
          showCreateForm();
          document.getElementById('pokemon-id').value = p.id;
          document.getElementById('p-nombre').value = p.nombre;
          document.getElementById('p-tipo').value = p.tipo;
          document.getElementById('p-nivel').value = p.nivel;
          document.getElementById('p-ataque').value = p.poder_ataque;
          document.getElementById('p-defensa').value = p.poder_defensa;
          document.getElementById('p-hp').value = p.hp;
          document.getElementById('p-desc').value = p.descripcion || '';
        }catch(err){ showAlert(err.message,'danger'); }
      }

      async function deletePokemon(id){
        if(!confirm('¿Eliminar este Pokémon?')) return;
        try{
          const res = await fetch(API_BASE + '/api/pokemon/' + id, { method: 'DELETE', headers: getAuthHeaders() });
          const data = await res.json();
          if(!res.ok){ showAlert(data.error || 'Error', 'danger'); return; }
          showAlert(data.message || 'Eliminado', 'success');
          loadAllPokemons();
        }catch(err){ showAlert(err.message,'danger'); }
      }

      async function promptAsignar(id){
        const trainer_email = prompt('Email del trainer al que asignar: (ej. ash@pokemon.com)');
        if(!trainer_email) return;
        const apodo = prompt('Apodo (opcional)');
        try{
          const res = await fetch(API_BASE + '/api/pokemon/' + id + '/asignar', { method: 'POST', headers: getAuthHeaders(), body: JSON.stringify({trainer_email, apodo}) });
          const data = await res.json();
          if(!res.ok){ showAlert(data.error || 'Error al asignar', 'danger'); return; }
          showAlert('Asignado correctamente', 'success');
        }catch(err){ showAlert(err.message,'danger'); }
      }

      // ---------- Trainer actions ----------
      async function loadTrainerPokemons(){
        try{
          const res = await fetch(API_BASE + '/api/pokemon', { headers: getAuthHeaders() });
          const data = await res.json();
          if(!res.ok){ showAlert(data.error || 'Error', 'danger'); return; }

          const list = document.getElementById('trainer-list');
          list.innerHTML = '';

          data.pokemons_capturados.forEach(c => {
            const p = c.pokemon;
            const el = document.createElement('div');
            el.className = 'list-group-item d-flex justify-content-between align-items-start';
            el.innerHTML = `
              <div>
                <div><strong>${p.nombre}</strong> <small class="text-muted">(#${p.id})</small></div>
                <div>Apodo: ${c.apodo || '-'} | Capturado: ${new Date(c.fecha_captura).toLocaleString()}</div>
                <div class="small">Tipo: ${p.tipo} | Nivel: ${p.nivel}</div>
              </div>
              <div>
                <button class="btn btn-sm btn-danger" onclick='liberarPokemon(${p.id})'>Liberar</button>
              </div>
            `;
            list.appendChild(el);
          });

        }catch(err){ showAlert(err.message,'danger'); }
      }

      async function liberarPokemon(pokemon_id){
        if(!confirm('¿Liberar este Pokémon de tu colección?')) return;
        try{
          const res = await fetch(API_BASE + '/api/pokemon/' + pokemon_id, { method: 'DELETE', headers: getAuthHeaders() });
          const data = await res.json();
          if(!res.ok){ showAlert(data.error || 'Error', 'danger'); return; }
          showAlert(data.message || 'Liberado', 'success');
          loadTrainerPokemons();
        }catch(err){ showAlert(err.message,'danger'); }
      }

      // Inicialización: si hay token, mostrar panel adecuado
      document.addEventListener('DOMContentLoaded', ()=>{
        const token = localStorage.getItem('access_token');
        if(token){ postLoginSetup(); }
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
